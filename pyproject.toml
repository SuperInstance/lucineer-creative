[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucineer-creative"
version = "0.1.0"
description = "MMX-powered creative asset pipeline for Roblox game builds"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lucineer"}]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
